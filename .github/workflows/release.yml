name: release

# Builds beam for macOS (amd64 + arm64) and publishes a GitHub Release
# with the tarballs + sha256 checksums whenever a vX.Y.Z tag is pushed.
# The homebrew-beam tap's formula downloads these binaries directly,
# so `brew install beam` doesn't need Go on the user's machine.
on:
  push:
    tags:
      - "v*.*.*"

permissions:
  contents: write

jobs:
  build:
    runs-on: macos-14
    strategy:
      matrix:
        goarch: [amd64, arm64]
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod

      - name: Build
        env:
          GOOS: darwin
          GOARCH: ${{ matrix.goarch }}
          CGO_ENABLED: 0
        run: |
          go build -trimpath -ldflags="-s -w -X main.version=${{ github.ref_name }}" -o beam .
          tar -czf "beam_darwin_${{ matrix.goarch }}.tar.gz" beam
          shasum -a 256 "beam_darwin_${{ matrix.goarch }}.tar.gz" > "beam_darwin_${{ matrix.goarch }}.tar.gz.sha256"

      - uses: actions/upload-artifact@v4
        with:
          name: beam_darwin_${{ matrix.goarch }}
          path: |
            beam_darwin_${{ matrix.goarch }}.tar.gz
            beam_darwin_${{ matrix.goarch }}.tar.gz.sha256

  release:
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true

      - uses: softprops/action-gh-release@v2
        with:
          files: dist/*
          generate_release_notes: true
